[workspace]
members = [
  "crates/nodescale-domain",
  "crates/nodescale-state",
  "crates/nodescale-provider",
  "crates/nodescale-provider-fake",
  "crates/nodescale-provider-headscale",
  "crates/nodescale-invitation",
  "crates/nodescale-redemption-ingress",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/Dadmin88/nodescale"

[workspace.dependencies]
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.8.7", features = ["json"] }
axum-server = { version = "0.7.3", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rcgen = "0.13"
rusqlite = { version = "0.37", features = ["bundled"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = "1.9"
x509-parser = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
