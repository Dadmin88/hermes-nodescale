name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Metadata
        run: cargo metadata --no-deps --format-version 1 > /dev/null
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace
      - name: Test SQLite migrations and state
        run: cargo test -p nodescale-state --test state
      - name: Build
        run: cargo build --workspace
      - name: Diff hygiene
        run: git diff --check
      - name: Public repository hygiene fixtures
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v scripts/tests/test_check_public_hygiene.py
      - name: Public repository hygiene
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          python3 scripts/check_public_hygiene.py --repo "$GITHUB_WORKSPACE" --tree "$tree"
