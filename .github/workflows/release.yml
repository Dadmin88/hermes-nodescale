name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build locked release binaries
        run: cargo build --locked --release -p nodescale-runtime --bins
      - name: Package exact-version artifact
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          artifact="nodescale-${TAG}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/$artifact"
          for binary in \
            nodescale-runtime \
            nodescale-owner \
            nodescale-adopt \
            nodescale-adopt-preflight \
            nodescale-adoption-target \
            nodescale-control-node \
            nodescale-keryx-v2-publisher \
            nodescale-project
          do
            install -m 0755 "target/release/$binary" "dist/$artifact/$binary"
          done
          install -m 0644 packaging/systemd/nodescale-runtime.service "dist/$artifact/nodescale-runtime.service"
          tar -C dist -czf "dist/$artifact.tar.gz" "$artifact"
          sha256sum "dist/$artifact.tar.gz" > "dist/$artifact.tar.gz.sha256"
      - name: Publish versioned artifacts and checksums
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
