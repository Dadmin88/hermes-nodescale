# Example only: replace the generic IDs with owner-selected stable UUIDs.
state_path = "/var/lib/nodescale/state.sqlite3"
poll_interval_seconds = 30
network_id = "11111111-1111-1111-1111-111111111111"
network_name = "Tailscale network"

# Disabled by default. To opt in, use a service-owned 0700 parent and set
# peer_uid to the numeric UID of the nodescale service account.
# [observation_api]
# socket_path = "/var/lib/nodescale/observations.sock"
# peer_uid = 999
#
# The operator-control API is a separate, read-only-by-default authority surface.
# [operator_api]
# socket_path = "/var/lib/nodescale/operator.sock"
# peer_uid = 999

[provider]
kind = "tailscale"
provider_instance_id = "22222222-2222-2222-2222-222222222222"
tailnet = "example.com"
credential_reference = "secret://systemd/provider-token"
auth = "api_access_token"
